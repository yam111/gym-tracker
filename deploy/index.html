/* Cubic 11 (俐方體11號) pixel CJK font, SIL OFL 1.1 — see fonts/OFL.txt */
@font-face {
  font-family: 'Cubic11';
  src: url('fonts/Cubic_11.woff2') format('woff2');
  font-display: swap;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cubic11','Noto Sans TC',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;}

/* Header */
#app-header{background:#16213e;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f3460;}
#app-title{font-family:'PressStart',monospace;font-size:11px;color:#f39c12;letter-spacing:1px;}
#xp-area{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
#level-badge{font-family:'PressStart',monospace;font-size:10px;color:#f1c40f;}
#xp-bar-wrap{width:120px;height:8px;background:#2c3e50;border-radius:4px;overflow:hidden;}
#xp-bar{height:100%;background:linear-gradient(90deg,#f39c12,#e74c3c);border-radius:4px;transition:width 0.5s;}
#xp-text{font-family:'PressStart',monospace;font-size:7px;color:#bdc3c7;}

/* Streak */
#streak-bar{background:#0f3460;padding:6px 16px;text-align:center;font-size:13px;color:#f39c12;}

/* Main */
#main{flex:1;overflow-y:auto;padding-bottom:70px;}
#section-map{height:100%;overflow:hidden;}

/* Bottom Nav */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#16213e;border-top:2px solid #0f3460;display:flex;z-index:100;}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:#7f8c8d;font-size:9px;font-family:'Cubic11','Noto Sans TC',sans-serif;transition:color 0.2s;}
.nav-btn.active{color:#f39c12;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn svg.px{width:24px;height:24px;}
.nav-px{display:flex;line-height:0;}
.nav-btn span{font-size:10px;}

/* Day Tabs */
#day-tabs{display:flex;overflow-x:auto;gap:6px;padding:12px 12px 0;scrollbar-width:none;}
#day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:6px 12px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.2s;background:#1a1a2e;color:#7f8c8d;}
.day-tab.active{color:#fff;border-color:currentColor;}
.day-tab.active.push{color:#e74c3c;border-color:#e74c3c;background:#2d1515;}
.day-tab.active.pull{color:#3498db;border-color:#3498db;background:#152030;}
.day-tab.active.legs{color:#2ecc71;border-color:#2ecc71;background:#152818;}
.day-tab.active.rest{color:#7f8c8d;border-color:#7f8c8d;}

/* Exercise Cards */
.ex-card{background:#1a1a2e;border-radius:12px;margin:12px;padding:14px;border:1px solid #2a2a4e;}
.ex-name{font-size:16px;font-weight:700;margin-bottom:10px;color:#fff;}
.ex-name span{font-size:12px;font-weight:400;color:#7f8c8d;margin-left:6px;}

/* Set rows */
.set-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:8px 10px;border-radius:8px;background:#0f0f2a;transition:all 0.2s;}
.set-row.confirmed{background:#0d1f0d;opacity:0.75;}
.set-row.locked{background:#111128;opacity:0.5;}
.set-num{font-size:12px;color:#7f8c8d;width:18px;flex-shrink:0;text-align:center;}
.set-inp{flex:1;min-width:0;}
.set-inp input{width:100%;background:#1e1e3e;border:1px solid #2a2a5e;border-radius:6px;color:#fff;font-size:16px;padding:6px 4px;font-family:'Cubic11','Noto Sans TC',sans-serif;text-align:center;}
.set-inp input:disabled{background:#181830;color:#555;border-color:#222;}
.set-inp label{font-size:10px;color:#7f8c8d;display:block;text-align:center;margin-bottom:2px;}
.confirm-btn{width:44px;height:44px;border-radius:50%;background:#27ae60;border:none;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.confirm-btn:active{transform:scale(0.9);}
.confirmed-icon{width:44px;height:44px;border-radius:50%;background:#1a3a1a;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lock-icon{width:44px;height:44px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#444;}

/* Add set button */
.add-set-btn{width:100%;padding:8px;border:1px dashed #2a2a5e;border-radius:8px;background:none;color:#7f8c8d;font-size:13px;cursor:pointer;margin-top:4px;font-family:'Cubic11','Noto Sans TC',sans-serif;}
.add-set-btn:hover{border-color:#3498db;color:#3498db;}

/* Complete button */
#complete-btn-wrap{padding:0 12px 12px;}
#complete-btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#f39c12,#e74c3c);border:none;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;transition:opacity 0.2s;}
#complete-btn:hover{opacity:0.9;}
#complete-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* Rest day */
#rest-msg{text-align:center;padding:60px 20px;color:#7f8c8d;}
#rest-msg .rest-icon{font-size:60px;margin-bottom:16px;}
#rest-msg h2{font-size:20px;color:#fff;margin-bottom:8px;}
#rest-msg p{font-size:14px;}

/* Map */
#map-section{padding:12px;}
.map-title{font-family:'PressStart',monospace;font-size:10px;color:#f39c12;margin-bottom:12px;}
.map-week-row{display:flex;gap:4px;margin-bottom:4px;align-items:center;}
.week-label{width:30px;font-size:9px;color:#555;flex-shrink:0;}
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1;}
.day-dot-sm{aspect-ratio:1;border-radius:3px;cursor:pointer;}
.push-done{background:#27ae60;}
.pull-done{background:#27ae60;}
.legs-done{background:#27ae60;}
.rest-day{background:#2a2a4e;cursor:default;}
.map-future{background:#1a1a2e;border:1px solid #2a2a4e;cursor:default;}
.missed{background:#3a3a3a;}
.today-dot{background:#f39c12;box-shadow:0 0 6px #f39c12;}

/* Day detail modal */
#day-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;justify-content:center;z-index:9996;}
#day-modal.show{display:flex;}
.day-modal-box{background:#1a1a2e;border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px;}
.day-modal-date{font-family:'PressStart',monospace;font-size:10px;color:#f39c12;margin-bottom:12px;}
.day-modal-ex{margin-bottom:12px;}
.day-modal-ex-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;}
.day-modal-set{font-size:12px;color:#bdc3c7;padding:3px 0;}
#part-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;justify-content:center;z-index:9996;}
#part-modal.show{display:flex;}
#part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.part-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;border:1px solid #2a2a4e;background:#0f0f2a;color:#e0e0e0;font-size:13px;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;}
.part-btn:active{border-color:#f39c12;}
.ex-icon{flex-shrink:0;margin-right:8px;image-rendering:pixelated;}
.ex-tile{flex-shrink:0;width:46px;height:46px;margin-right:10px;display:flex;align-items:center;justify-content:center;background:#9bbc0f;border:3px solid #0f380f;box-shadow:2px 2px 0 #306230;}
.ex-tile .ex-icon{margin-right:0;}
.px{vertical-align:middle;flex-shrink:0;}
.px-tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:#9bbc0f;border:3px solid #0f380f;box-shadow:2px 2px 0 #306230;}
.ach-card:not(.unlocked) .px-tile{opacity:.55;}
.ach-lock{opacity:.7;}
.day-modal-close{width:100%;padding:12px;border-radius:8px;border:none;background:#2a2a4e;color:#fff;font-size:15px;cursor:pointer;margin-top:12px;font-family:'Cubic11','Noto Sans TC',sans-serif;}

/* Achievements */
#ach-section{padding:12px;}
.ach-card{background:#1a1a2e;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #2a2a4e;}
.ach-card.unlocked{border-color:#f39c12;background:#1e1a10;}
.ach-icon{font-size:28px;width:44px;text-align:center;}
.ach-info{flex:1;}
.ach-name{font-size:14px;font-weight:700;color:#fff;}
.ach-card:not(.unlocked) .ach-name{color:#555;}
.ach-desc{font-size:12px;color:#7f8c8d;margin-top:2px;}
.ach-card:not(.unlocked) .ach-desc{color:#333;}
.ach-lock{font-size:20px;color:#333;}

/* Settings */
#set-section{padding:12px;}
.set-group{background:#1a1a2e;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #2a2a4e;}
.set-group h3{font-size:14px;color:#f39c12;margin-bottom:12px;font-weight:700;}
.set-row-item{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.set-row-item label{font-size:13px;color:#bdc3c7;}
.set-row-item input[type=date]{background:#0f0f2a;border:1px solid #2a2a5e;border-radius:8px;color:#fff;font-size:16px;padding:8px 10px;font-family:'Cubic11','Noto Sans TC',sans-serif;width:100%;}
.danger-btn{width:100%;padding:12px;border-radius:8px;border:1px solid #e74c3c;background:none;color:#e74c3c;font-size:14px;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;margin-top:6px;}
.danger-btn:hover{background:#e74c3c;color:#fff;}
.save-btn{width:100%;padding:12px;border-radius:8px;border:none;background:#27ae60;color:#fff;font-size:14px;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;margin-top:6px;}

/* Toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#f39c12;color:#000;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;transition:transform 0.3s;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Achievement notification */
#ach-notif{position:fixed;top:70px;right:-320px;background:#1a1a2e;border:2px solid #f39c12;border-radius:12px;padding:12px 14px;width:280px;z-index:9995;transition:right 0.4s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 4px 20px rgba(0,0,0,0.5);}
#ach-notif.show{right:12px;}
.ach-notif-inner{display:flex;align-items:center;gap:10px;}
.ach-notif-icon{font-size:28px;flex-shrink:0;}
.ach-notif-text{}
.ach-notif-label{font-size:9px;color:#f39c12;font-family:'PressStart',monospace;margin-bottom:3px;}
.ach-notif-name{font-size:14px;font-weight:700;color:#fff;}
.ach-notif-desc{font-size:11px;color:#7f8c8d;margin-top:2px;}

/* Coach analysis overlay */
#coach-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;z-index:9997;overflow-y:auto;}
#coach-overlay.show{display:flex;}
.coach-header{background:#16213e;padding:16px;text-align:center;font-family:'PressStart',monospace;font-size:11px;color:#f39c12;letter-spacing:1px;flex-shrink:0;}
.coach-body{padding:12px;flex:1;}
.coach-ex{background:#1a1a2e;border-radius:12px;margin-bottom:12px;padding:14px;border-left:4px solid #2a2a5e;}
.coach-ex-name{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;}
.coach-sets{font-size:12px;color:#7f8c8d;margin-bottom:10px;line-height:1.8;}
.coach-advice{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:700;}
.advice-up{background:#0d2e1a;color:#2ecc71;border:1px solid #27ae60;}
.advice-hold{background:#1a1a0d;color:#f39c12;border:1px solid #f39c12;}
.advice-down{background:#2e0d0d;color:#e74c3c;border:1px solid #c0392b;}
.advice-icon{font-size:20px;flex-shrink:0;}
.coach-footer{padding:16px;flex-shrink:0;}
.coach-close-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#3498db;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;}

/* Level up overlay */
#lvl-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9998;flex-direction:column;gap:16px;}
#lvl-overlay.show{display:flex;}
.lvl-title{font-family:'PressStart',monospace;font-size:16px;color:#f1c40f;text-align:center;line-height:2;}
.lvl-btn{padding:12px 32px;border-radius:20px;border:none;background:#f39c12;color:#000;font-size:16px;font-weight:700;cursor:pointer;font-family:'Cubic11','Noto Sans TC',sans-serif;}

/* No plan notice */
#no-plan-notice{background:#1a1a2e;border:1px solid #f39c12;border-radius:10px;margin:12px;padding:12px;font-size:13px;color:#f39c12;text-align:center;}

/* Day header */
.day-header{padding:10px 12px 4px;font-size:13px;color:#7f8c8d;}
.day-header strong{color:#fff;font-size:15px;}

/* ─── Game Boy theme（四階綠：#0f380f / #306230 / #8bac0f / #9bbc0f）───
   Overrides the base styles above; inline colors in render functions are
   remapped with attribute selectors. */
body{background:#9bbc0f;color:#0f380f;}
#app-header{background:#306230;border-bottom:3px solid #0f380f;}
#app-title,#level-badge{color:#9bbc0f;}
#xp-text{color:#8bac0f;}
#xp-bar-wrap{border-radius:0;background:#0f380f;border:2px solid #0f380f;height:10px;}
#xp-bar{border-radius:0;background:#9bbc0f;}
#streak-bar{background:#8bac0f;color:#0f380f;border-bottom:3px solid #0f380f;font-weight:700;}
#streak-bar *{color:#0f380f!important;}

.day-tab{border-radius:0;background:#0f380f!important;color:#9bbc0f!important;border:2px solid #0f380f!important;}
.day-header{color:#306230;}
.day-header strong{color:#0f380f;font-size:17px;}

.ex-card{background:#8bac0f;border:3px solid #0f380f;border-radius:0;box-shadow:4px 4px 0 #306230;margin:14px 12px;}

.ex-name > span:last-child{color:#0f380f!important;font-family:'PressStart',monospace;font-size:9px!important;}
.ex-name button{filter:grayscale(1) brightness(.4);}

.set-row{background:#9bbc0f;border:2px solid #306230;border-radius:0;}
.set-num{font-family:'PressStart',monospace;font-size:10px;color:#0f380f;}
.set-inp label{color:#306230;font-weight:700;}
.set-inp input{background:#8bac0f;color:#0f380f;border:2px solid #0f380f;border-radius:0;font-family:'PressStart',monospace;font-size:14px;padding:8px 4px;}
.set-inp input:focus{outline:none;background:#0f380f;color:#9bbc0f;}
.set-row button{background:#306230!important;color:#9bbc0f!important;border-radius:0!important;}

.add-set-btn{border:2px dashed #306230;border-radius:0;color:#0f380f;font-weight:700;}
#complete-btn{background:#0f380f;color:#9bbc0f;border-radius:0;box-shadow:4px 4px 0 #306230;font-size:17px;}

#bottom-nav{background:#306230;border-top:3px solid #0f380f;}
.nav-btn{color:#8bac0f;}
.nav-btn.active{color:#9bbc0f;background:#0f380f;}

/* recolor body-part icons to green shades */
.ex-icon rect{fill:#306230;}
.ex-icon rect[fill="#c8a27a"],.ex-icon rect[fill="#6b5a48"]{fill:#0f380f;}
.ex-icon rect[fill="#f39c12"]{fill:#e0f8a0;}
.ex-icon rect[fill="#0a0a1a"]{fill:#9bbc0f;}

.set-group,.ach-card,.day-modal-box,.part-btn{background:#8bac0f!important;color:#0f380f!important;border:3px solid #0f380f!important;border-radius:0!important;}
.set-group h3,.day-modal-date,.ach-name,.day-modal-ex-name{color:#0f380f!important;}
.save-btn,.day-modal-close{background:#0f380f;color:#9bbc0f;border-radius:0;}
.danger-btn{border-radius:0;border-color:#0f380f;color:#0f380f;}
#toast{background:#0f380f;color:#9bbc0f;border-radius:0;}

/* ── Other tabs (map / diet / achievements / progress): inline colors → Game Boy palette ── */
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#fff"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#ecf0f1"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#f39c12"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#e74c3c"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#3498db"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#27ae60"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#2ecc71"],
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#9b59b6"]{color:#0f380f!important;}
:is(#section-map,#section-diet,#section-achievements,#section-progress) [style*="color:#7f8c8d"]{color:#306230!important;}

/* big panels */
#section-diet [style*="background:#16213e"],
#section-achievements [style*="background:#16213e"],
#section-progress [style*="background:#1a1a2e"]{background:#8bac0f!important;border:3px solid #0f380f;border-radius:0!important;box-shadow:4px 4px 0 #306230;}
/* inner boxes */
#section-diet [style*="background:#1a1a2e"]{background:#9bbc0f!important;border:2px solid #306230;border-radius:0!important;}
/* highlight box (全日合計) */
#section-diet [style*="background:#0f3460"]{background:#0f380f!important;border-radius:0!important;}
#section-diet [style*="background:#0f3460"] *{color:#9bbc0f!important;}
#section-diet [style*="background:#0f3460"] [style*="color:#7f8c8d"]{color:#8bac0f!important;}
/* lines */
#section-diet [style*="solid #2a2a4a"],#section-diet [style*="solid #1a1a2e"]{border-color:#306230!important;}
#section-diet table{font-size:10px!important;min-width:0!important;}
#section-diet th,#section-diet td{padding-left:2px!important;padding-right:2px!important;white-space:nowrap;}
#section-diet [style*="solid #f39c12"]{border-color:#0f380f!important;border-top-width:2px!important;}

/* achievements: title progress bar + cards */
#section-achievements [style*="background:#0a0a1a"]{background:#0f380f!important;border-radius:0!important;height:8px!important;}
#section-achievements [style*="linear-gradient"]{background:#9bbc0f!important;border-radius:0!important;}
.ach-card.unlocked{background:#0f380f!important;}
.ach-card.unlocked .ach-name{color:#9bbc0f!important;}
.ach-card.unlocked .ach-desc{color:#8bac0f!important;}
.ach-card:not(.unlocked) .ach-name{color:#306230!important;}
.ach-card:not(.unlocked) .ach-desc{color:#306230!important;opacity:.8;}

/* progress chart bars */
#section-progress [style*="background:#3498db"]{background:#0f380f!important;border-radius:0!important;width:10px!important;}

/* map */
#section-map button[style*="background:#1a1a2e"]{background:#0f380f!important;color:#9bbc0f!important;border-radius:0!important;}
#section-map [style*="background:#12122a"]{background:#8bac0f!important;color:#306230!important;border-radius:0!important;}
#section-map [style*="background:#0d0d1a"]{background:#9bbc0f!important;color:#8bac0f!important;border:2px solid #8bac0f!important;border-radius:0!important;}
#section-map [style*="background:#1e7a45"]{background:#0f380f!important;color:#9bbc0f!important;border-radius:0!important;}
#section-map div[style*="solid #f39c12"]{background:#e0f8a0!important;color:#0f380f!important;border:3px solid #0f380f!important;border-radius:0!important;}

/* modals / overlays */
.day-modal-set{color:#306230;}
#day-modal-body [style*="color:#f39c12"]{color:#0f380f!important;font-weight:700;}
#day-modal-body [style*="color:#7f8c8d"]{color:#306230!important;}
.day-modal-ex{border-bottom:2px dashed #306230;padding-bottom:8px;}
.part-btn span{color:#0f380f;}
#ach-notif{background:#8bac0f;border:3px solid #0f380f;border-radius:0;box-shadow:4px 4px 0 #306230;}
.ach-notif-label,.ach-notif-name{color:#0f380f;font-weight:700;}
.ach-notif-desc{color:#306230;}
.coach-header{background:#306230;color:#9bbc0f;}
.coach-ex{background:#8bac0f;border-radius:0;border-left:6px solid #0f380f;}
.coach-ex-name{color:#0f380f;}
.coach-sets{color:#306230;}
.advice-up,.advice-hold,.advice-down{border-radius:0;background:#9bbc0f;color:#0f380f;border:2px solid #0f380f;}
.advice-up{background:#0f380f;color:#9bbc0f;}
.coach-close-btn,.lvl-btn{background:#9bbc0f;color:#0f380f;border-radius:0;box-shadow:4px 4px 0 #306230;}
.lvl-title{color:#9bbc0f;}

/* settings: progress box (inline colors) */
#section-settings [style*="background:#0f0f2a"]{background:#9bbc0f!important;border:2px solid #306230;border-radius:0!important;color:#0f380f!important;}
#section-settings [style*="color:#f39c12"]{color:#0f380f!important;}
#section-settings [style*="color:#7f8c8d"]{color:#306230!important;}
</style>
</head>
<body>

<!-- Day Detail Modal -->
<div id="day-modal" onclick="closeDayModal()">
  <div class="day-modal-box" onclick="event.stopPropagation()">
    <div class="day-modal-date" id="day-modal-date"></div>
    <div id="day-modal-body"></div>
    <button class="day-modal-close" onclick="closeDayModal()">關閉</button>
  </div>
</div>

<!-- Body Part Picker -->
<div id="part-modal" onclick="closePartPicker()">
  <div class="day-modal-box" onclick="event.stopPropagation()">

    <div id="part-grid"></div>
    <button class="day-modal-close" onclick="closePartPicker()">取消</button>
  </div>
</div>

    <button class="coach-close-btn" onclick="closeCoach()">了解，繼續 ▶</button>

</div>

    <div class="ach-notif-text">
      <div class="ach-notif-label"><span data-px="trophy"></span> 成就解鎖！</div>
      <div class="ach-notif-name" id="ach-notif-name"></div>
      <div class="ach-notif-desc" id="ach-notif-desc"></div>

  </div>
</div>

<!-- Header -->
<div id="app-header">

</div>

  <div id="section-diet" style="display:none"></div>

</div>

// ─── Init ────────────────────────────────────────────────────
function saveDraft(){
  localStorage.setItem(GYM_SESSION_DRAFT, JSON.stringify({
    session: currentSession,
    confirmed: confirmedSets,
    day: currentDay,
    date: todayStr()
  }));
}

function loadDraft(){
  const raw = localStorage.getItem(GYM_SESSION_DRAFT);
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    // Only restore if draft is from today
    if(d.date === todayStr()){
      currentSession = d.session || {};
      confirmedSets  = d.confirmed || {};
      if(d.day) currentDay = d.day;
    } else {
      localStorage.removeItem(GYM_SESSION_DRAFT);
    }
  }catch(e){}
}

function init(){
  const gs = localStorage.getItem(GYM_GAME);
  if(gs) try{ gameState = JSON.parse(gs); }catch(e){}
  const ss = localStorage.getItem(GYM_SESSIONS);
  if(ss) try{ sessions = JSON.parse(ss); }catch(e){}
  templates = getTemplates();

  // Load progress (which cycle step we're on)
  const prog = localStorage.getItem(GYM_PROGRESS);
  if(prog) try{ cycleProgress = parseInt(JSON.parse(prog).step)||0; }catch(e){}
  const sched = getCurrentSchedule();
  currentDay = sched.day || 1;

  document.querySelectorAll('[data-px]').forEach(el=>{ el.innerHTML = pxIcon(el.dataset.px, 1); });
  document.querySelectorAll('[data-pxnav]').forEach(el=>{ el.innerHTML = pxNavIcon(el.dataset.pxnav); });
  loadDraft();
  renderHeader();
  renderAll();
}

function getTemplates(){
  const saved = localStorage.getItem(GYM_TEMPLATES);
  const custom = saved ? JSON.parse(saved) : {};
  const merged = {};
  for(let d=1;d<=4;d++){
    merged[d] = custom[d]
      ? JSON.parse(JSON.stringify(custom[d]))
      : JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[d]));
  }
  return merged;
}

// ─── Schedule ────────────────────────────────────────────────
function getCurrentSchedule(){
  const step = WEEK_CYCLE[cycleProgress] || WEEK_CYCLE[0];
  return {schedule: step, cyclePos: cycleProgress, day: step.day};
}

function advanceCycle(){
  let next = (cycleProgress + 1) % WEEK_CYCLE.length;
  cycleProgress = next;
  localStorage.setItem(GYM_PROGRESS, JSON.stringify({step: cycleProgress}));
  currentDay = WEEK_CYCLE[cycleProgress].day || 1;
}

// ─── Header ──────────────────────────────────────────────────
function renderHeader(){
  document.getElementById('level-badge').textContent = 'LV.'+gameState.level;
  const xpInLevel = gameState.xp - (gameState.level-1)*XP_PER_LEVEL;
  const pct = Math.min(100,(xpInLevel/XP_PER_LEVEL)*100);
  document.getElementById('xp-bar').style.width = pct+'%';
  const xpDisplay = Math.min(xpInLevel, XP_PER_LEVEL);
  document.getElementById('xp-text').textContent = (gameState.level>=MAX_LEVEL ? 'MAX' : xpDisplay+' / '+XP_PER_LEVEL+' XP');
  document.getElementById('streak-val').textContent = gameState.streak;
  document.getElementById('title-badge').textContent = '【'+getTitle()+'】';
}

function showSection(sec){
  currentSection = sec;
  ['workout','map','diet','achievements','progress','settings'].forEach(s=>{
    document.getElementById('section-'+s).style.display = s===sec ? '' : 'none';
    document.getElementById('nav-'+s).classList.toggle('active', s===sec);
  });
  renderAll();
}

function renderAll(){
  if(currentSection==='workout')           renderWorkout();
  else if(currentSection==='map')          renderMap();
  else if(currentSection==='diet')         renderDiet();
  else if(currentSection==='achievements') renderAchievements();
  else if(currentSection==='progress')     renderProgress();
  else if(currentSection==='settings')     renderSettings();
}

function getExPart(ex){
  if(ex.part && BODY_PARTS[ex.part]) return ex.part;
  const hit = PART_KEYWORDS.find(([kw])=>ex.name.indexOf(kw)>=0);
  return hit ? hit[1] : null;
}

function bodyIconSVG(part, scale){
  const p = BODY_PARTS[part];
  const view = p ? p.view : 'front';
  const hl = p ? p.hl : '';
  let rects = '';
  BODY_PIXELS.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const c = row[x];
      if(c==='.') continue;
      let fill = hl.indexOf(c)>=0 ? '#f39c12' : '#3a3a62';
      if(c==='H') fill = view==='back' ? '#6b5a48' : '#c8a27a';
      rects += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+fill+'"/>';
    }
  });
  if(view==='front') rects += '<rect x="5" y="2" width="1" height="1" fill="#0a0a1a"/><rect x="7" y="2" width="1" height="1" fill="#0a0a1a"/>';
  return '<svg class="ex-icon" width="'+(13*scale)+'" height="'+(20*scale)+'" viewBox="0 0 13 20" shape-rendering="crispEdges">'+rects+'</svg>';
}

function pxSVG(grid, scale){
  const n = grid.length;
  let r='';
  grid.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const f = SPRITE_PAL[row[x]];
      if(f) r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>';
    }
  });
  return '<svg class="px" width="'+(n*scale)+'" height="'+(n*scale)+'" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges">'+r+'</svg>';
}
// Single-colour version for the nav bar: outline pixels (K/D) take currentColor, fills stay transparent
function pxNavIcon(name){
  const g = PX_ICONS[name]; if(!g) return '';
  let r='';
  g.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ if(row[x]==='K'||row[x]==='D') r += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; } });
  return '<svg class="px" width="24" height="24" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">'+r+'</svg>';
}
function pxIcon(name, scale){ return PX_ICONS[name] ? pxSVG(PX_ICONS[name], scale||1) : ''; }

// Achievement emoji -> pixel tile (two icons side by side for doubled emojis)
function achIconHTML(emoji){
  const names = EMOJI_PX[emoji] || ['star'];
  return '<span class="px-tile">'+names.map(n=>pxIcon(n, names.length>1?1:2)).join('')+'</span>';
}

// Name keyword -> sprite (first match wins; specific before general)
const SPRITE_KEYWORDS = [
  ['上斜啞鈴','上斜啞鈴臥推'],['上斜','上斜臥推'],['臥推','臥推'],
  ['下拉','高位下拉'],['坐姿划船','坐姿划船'],['划船','划船'],
  ['肩推','肩推'],['平舉','側平舉'],['二頭','二頭彎舉'],['三頭','三頭下壓'],
  ['羅馬尼亞','羅馬尼亞硬舉'],['硬舉','硬舉'],['硬拉','硬舉'],
  ['腿推','腿推'],['腿彎舉','腿彎舉'],['腿伸展','腿伸展'],['小腿','小腿'],
  ['腹','腹部'],['哈克','哈克深蹲'],['深蹲','深蹲'],['臀推','臀推']
];

function spriteSVG(grid, scale){
  let r='';
  grid.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      const f = SPRITE_PAL[row[x]];
      if(f) r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>';
    }
  });
  return '<svg width="'+(20*scale)+'" height="'+(20*scale)+'" viewBox="0 0 20 20" shape-rendering="crispEdges">'+r+'</svg>';
}

// Tile icon for an exercise card: exercise sprite, else body-part figure
function exIconHTML(ex){
  const hit = EX_SPRITES[ex.name] ? ex.name : (SPRITE_KEYWORDS.find(([kw])=>ex.name.indexOf(kw)>=0)||[])[1];
  const inner = hit ? spriteSVG(EX_SPRITES[hit],2) : bodyIconSVG(getExPart(ex),2);
  return '<span class="ex-tile">'+inner+'</span>';
}

  const sched = getCurrentSchedule();

  let html = '';

  const dayInfo = WEEK_CYCLE.find(w=>w.day===currentDay) || WEEK_CYCLE[0];
  html += '<div class="day-header"><strong>'+escHtml(dayInfo.label)+'</strong></div>';
  html += '<div id="ex-list">'+renderExercisesHTML()+'</div>';

function renderDayTabsHTML(sched){
  const sc = sched.schedule || WEEK_CYCLE[0];
  return '<div id="day-tabs"><div class="day-tab '+sc.color+' active">'+escHtml(sc.label)+'</div></div>';
}

function renderExercisesHTML(){
  const exList = templates[currentDay] || [];
  if(!currentSession[currentDay]) currentSession[currentDay] = {};

  let html = '';
  exList.forEach((ex, ei)=>{
    // Pre-fill with template weight+reps if not yet started
    if(!currentSession[currentDay][ei]){
      currentSession[currentDay][ei] = ex.sets.map(s=>({w:s.w||'', r:s.r||8}));
    }
    const sess = currentSession[currentDay][ei];
    // Sets removed down to 0 = skipped today; hide card (template untouched, returns next time)
    if(!sess.length) return;

    html += '<div class="ex-card">';
    // Exercise name with edit/delete buttons
    html += '<div class="ex-name" style="display:flex;align-items:center;">'+
      exIconHTML(ex)+
      '<span id="exname-'+ei+'">'+escHtml(ex.name)+'</span>'+
      '<button onclick="editExName('+ei+')" style="background:none;border:none;color:#7f8c8d;font-size:12px;cursor:pointer;margin-left:6px;" title="改名">'+pxIcon('pencil',1)+'</button>'+
      '<button onclick="removeExercise('+ei+')" style="background:none;border:none;color:#e74c3c;font-size:12px;cursor:pointer;margin-left:2px;" title="刪除動作">'+pxIcon('trash',1)+'</button>'+
      '<span style="font-size:12px;font-weight:400;color:#7f8c8d;margin-left:auto;">'+sess.length+' 組</span>'+
    '</div>';

    sess.forEach((set, si)=>{
      html += '<div class="set-row" id="setrow-'+ei+'-'+si+'">';
      html += '<div class="set-num">'+(si+1)+'</div>';
      html += setInputsHTML(ei,si,set,false);
      html += '<button onclick="removeSet('+ei+','+si+')" style="width:36px;height:36px;border-radius:50%;background:#2a1a1a;border:none;color:#e74c3c;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">'+pxIcon('x',1)+'</button>';
      html += '</div>';
    });

    html += '<button class="add-set-btn" onclick="addSet('+ei+')">+ 新增一組</button>';
    html += '</div>';
  });
  html += '<button class="add-set-btn" onclick="addExercise()" style="width:100%;margin-top:4px;background:#1a2a1a;border:1px dashed #27ae60;color:#27ae60;">+ 新增動作</button>';
  return html;
}

function setInputsHTML(ei,si,set,disabled){
  const d = disabled ? ' disabled' : '';
  const vw  = (set.w  !== '' && set.w  !== undefined) ? escHtml(String(set.w))  : '';
  const vr  = (set.r  !== '' && set.r  !== undefined) ? escHtml(String(set.r))  : '';
  return '<div class="set-inp"><label>重量kg</label><input type="number" inputmode="decimal"'+d+' value="'+vw+'" oninput="updateSet('+ei+','+si+',\'w\',this.value)"></div>'+
         '<div class="set-inp"><label>次數</label><input type="number" inputmode="numeric"'+d+' value="'+vr+'" oninput="updateSet('+ei+','+si+',\'r\',this.value)"></div>';
}

function selectDay(d, silent){
  if(currentDay === d) return;
  if(!silent){
    const hasProgress = confirmedSets[currentDay] &&
      Object.values(confirmedSets[currentDay]).some(v=>v>=0);
    if(hasProgress){
      if(!confirm('切換訓練日（已確認的組數資料仍會保留）。確定切換？')) return;
    }
  }
  currentDay = d;
  renderWorkout();
}

function updateSet(ei,si,field,val){
  if(!currentSession[currentDay] || !currentSession[currentDay][ei]) return;
  currentSession[currentDay][ei][si][field] = (val==='' ? '' : parseFloat(val));
  saveDraft();
}

function unlockSet(ei, si){
  if(!confirmedSets[currentDay]) return;
  // Roll back confirmed index to si-1 (unlock this set and all after)
  confirmedSets[currentDay][ei] = si - 1;
  // Also unlock all subsequent exercises
  const exList = templates[currentDay] || [];
  exList.forEach((_,i)=>{ if(i > ei) delete confirmedSets[currentDay][i]; });
  saveDraft();
  renderWorkout();
}

function confirmSet(ei, si){
  if(!currentSession[currentDay] || !currentSession[currentDay][ei]) return;
  const set = currentSession[currentDay][ei][si];
  if(set.w==='' || set.r==='' ||
     set.w===undefined || set.r===undefined){
    showToast('請填寫重量和次數');
    return;
  }
  if(!confirmedSets[currentDay]) confirmedSets[currentDay]={};
  confirmedSets[currentDay][ei] = si;
  awardXP(XP_PER_SET);
  saveDraft();
  renderWorkout();
}

function addSet(ei){
  if(!currentSession[currentDay]) currentSession[currentDay]={};
  if(!currentSession[currentDay][ei]) return;
  const last = currentSession[currentDay][ei].slice(-1)[0];
  currentSession[currentDay][ei].push({w:last?last.w:'', r:last?last.r:8});
  saveDraft();
  renderWorkout();
}

function removeSet(ei, si){
  if(!currentSession[currentDay]||!currentSession[currentDay][ei]) return;

  currentSession[currentDay][ei].splice(si,1);
  saveDraft();
  renderWorkout();
}

function editExName(ei){
  const exList = templates[currentDay];
  if(!exList||!exList[ei]) return;
  const current = exList[ei].name;
  const newName = prompt('動作名稱：', current);
  if(!newName||!newName.trim()||newName===current) return;
  const saved = localStorage.getItem(GYM_TEMPLATES);
  const custom = saved ? JSON.parse(saved) : {};
  if(!custom[currentDay]) custom[currentDay] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[currentDay]));
  custom[currentDay][ei].name = newName.trim();
  localStorage.setItem(GYM_TEMPLATES, JSON.stringify(custom));
  templates = getTemplates();
  renderWorkout();
}

function addExercise(){
  const name = prompt('動作名稱：', '');
  if(!name||!name.trim()) return;
  openPartPicker(part=>{
    const saved = localStorage.getItem(GYM_TEMPLATES);
    const custom = saved ? JSON.parse(saved) : {};
    if(!custom[currentDay]) custom[currentDay] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[currentDay]));
    custom[currentDay].push({name:name.trim(), part, sets:[{w:'',r:8}]});
    localStorage.setItem(GYM_TEMPLATES, JSON.stringify(custom));
    templates = getTemplates();
    renderWorkout();
  });
}

function removeExercise(ei){
  const exList = templates[currentDay];
  if(!exList) return;
  if(!confirm('刪除「'+exList[ei].name+'」？')) return;
  const saved = localStorage.getItem(GYM_TEMPLATES);
  const custom = saved ? JSON.parse(saved) : {};
  if(!custom[currentDay]) custom[currentDay] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[currentDay]));
  custom[currentDay].splice(ei,1);
  localStorage.setItem(GYM_TEMPLATES, JSON.stringify(custom));
  // Also remove from currentSession / confirmedSets, shifting later indices down
  // so each exercise keeps its own entered sets
  [currentSession, confirmedSets].forEach(store=>{
    const byIdx = store[currentDay];
    if(!byIdx) return;
    const shifted = {};
    Object.keys(byIdx).forEach(k=>{
      const i = parseInt(k);
      if(i < ei) shifted[i] = byIdx[k];
      else if(i > ei) shifted[i-1] = byIdx[k];
    });
    store[currentDay] = shifted;
  });
  templates = getTemplates();
  saveDraft();
  renderWorkout();
}

function completeWorkout(){
  const exList = templates[currentDay] || [];
  const today = todayStr();
  const dayInfo = WEEK_CYCLE.find(w=>w.day===currentDay) || WEEK_CYCLE[0];
  const sessionData = {
    date:today, day:currentDay, type:dayInfo.type,
    exercises: exList.map((ex,ei)=>({
      name:ex.name,
      sets:(currentSession[currentDay]&&currentSession[currentDay][ei]||[])
        .filter(s=>s.w!==''&&s.w!==undefined&&s.r!==''&&s.r!==undefined)
    }))
  };
  sessions.push(sessionData);
  localStorage.setItem(GYM_SESSIONS, JSON.stringify(sessions));

  // Save last-used weights/reps back to templates so next session pre-fills with them
  const saved = localStorage.getItem(GYM_TEMPLATES);
  const custom = saved ? JSON.parse(saved) : {};
  if(!custom[currentDay]) custom[currentDay] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[currentDay]||exList));
  sessionData.exercises.forEach((ex, ei)=>{
    if(!ex.sets.length) return;
    if(!custom[currentDay][ei]) return;
    custom[currentDay][ei].name = ex.name;
    custom[currentDay][ei].sets = ex.sets.map(s=>({w:s.w, r:s.r}));
  });
  localStorage.setItem(GYM_TEMPLATES, JSON.stringify(custom));
  templates = getTemplates();

  updateStreak(today);
  awardXP(XP_COMPLETE);
  checkAchievements(sessionData, {});

  // Reset session data for this day
  currentSession[currentDay]={};
  confirmedSets[currentDay]={};
  localStorage.removeItem(GYM_SESSION_DRAFT);

  // Advance to next training day
  advanceCycle();

  showToast('訓練完成！+'+XP_COMPLETE+' XP！');
  renderHeader();
  renderAll();
}

function updateStreak(today){
  const last = gameState.lastDate;
  if(!last){
    gameState.streak=1;
  } else {
    const diff = dateDiffDays(last, today);
    if(diff===0){
      // same day, no change
    } else if(diff===1){
      gameState.streak++;
    } else if(diff===2){
      // Allow gap of 1 day (scheduled rest day between workouts)
      gameState.streak++;
    } else {
      gameState.streak=1;
    }
  }
  gameState.lastDate=today;
  localStorage.setItem(GYM_GAME, JSON.stringify(gameState));
}

// ─── XP & Level ──────────────────────────────────────────────
function awardXP(n){
  const prevLevel = gameState.level;
  gameState.xp += n;
  const newLevel = Math.min(MAX_LEVEL, Math.floor(gameState.xp/XP_PER_LEVEL)+1);
  if(newLevel > prevLevel){
    gameState.level = newLevel;
    showLevelUp(newLevel);
  }
  localStorage.setItem(GYM_GAME, JSON.stringify(gameState));
  renderHeader();
}

  document.getElementById('ach-notif-icon').innerHTML = achIconHTML(def.icon);

  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(processAchNotifQueue, 500);
  }, 3000);
}

function checkAchievements(sessionData, extraFlags){
  const unlocked = new Set(gameState.achievements);
  const newOnes = [];
  const flag = extraFlags || {};

  // 出勤
  const total = sessions.length;
  [10,30,60,100,200].forEach(n=>{ if(total>=n && !unlocked.has('sess_'+n)) newOnes.push('sess_'+n); });

  // 連續
  [7,14,30,60,100,365].forEach(n=>{ if(gameState.streak>=n && !unlocked.has('streak_'+n)) newOnes.push('streak_'+n); });

  // 等級
  [5,10,20,30,52].forEach(n=>{ if(gameState.level>=n && !unlocked.has('level_'+n)) newOnes.push('level_'+n); });

  // XP
  [1000,5000,10000,30000].forEach(n=>{ if(gameState.xp>=n && !unlocked.has('xp_'+n)) newOnes.push('xp_'+n); });

  // 重量成就（從歷史紀錄找最大重量）
  const maxWeights = {};
  sessions.forEach(s=>{
    (s.exercises||[]).forEach(ex=>{
      const mx = Math.max(...(ex.sets||[]).map(st=>parseFloat(st.w)||0));
      if(!maxWeights[ex.name] || mx > maxWeights[ex.name]) maxWeights[ex.name] = mx;
    });
  });
  const bench  = maxWeights['臥推']||0;
  const pullW  = maxWeights['滑輪下拉']||0;
  const legW   = maxWeights['腿推舉']||0;
  const squatW = maxWeights['深蹲']||0;
  const deadW  = Math.max(maxWeights['傳統硬拉']||0, maxWeights['羅馬尼亞硬拉']||0);
  [{id:'bench_60',v:60},{id:'bench_80',v:80},{id:'bench_100',v:100},{id:'bench_120',v:120}]
    .forEach(({id,v})=>{ if(bench>=v && !unlocked.has(id)) newOnes.push(id); });
  [{id:'pull_50',v:50},{id:'pull_65',v:65},{id:'pull_80',v:80},{id:'pull_100',v:100}]
    .forEach(({id,v})=>{ if(pullW>=v && !unlocked.has(id)) newOnes.push(id); });
  [{id:'leg_60',v:60},{id:'leg_100',v:100},{id:'leg_150',v:150},{id:'leg_200',v:200}]
    .forEach(({id,v})=>{ if(legW>=v && !unlocked.has(id)) newOnes.push(id); });
  [{id:'squat_60',v:60},{id:'squat_80',v:80},{id:'squat_100',v:100},{id:'squat_120',v:120}]
    .forEach(({id,v})=>{ if(squatW>=v && !unlocked.has(id)) newOnes.push(id); });
  [{id:'dead_100',v:100},{id:'dead_120',v:120},{id:'dead_150',v:150},{id:'dead_180',v:180}]
    .forEach(({id,v})=>{ if(deadW>=v && !unlocked.has(id)) newOnes.push(id); });

  // 上肢/下肢日次數
  const upperCount = sessions.filter(s=>s.type==='upper').length;
  const lowerCount = sessions.filter(s=>s.type==='lower').length;
  [{id:'upper_5',v:5},{id:'upper_15',v:15},{id:'upper_30',v:30},{id:'upper_60',v:60}]
    .forEach(({id,v})=>{ if(upperCount>=v && !unlocked.has(id)) newOnes.push(id); });
  [{id:'lower_5',v:5},{id:'lower_15',v:15},{id:'lower_30',v:30},{id:'lower_60',v:60}]
    .forEach(({id,v})=>{ if(lowerCount>=v && !unlocked.has(id)) newOnes.push(id); });

  // 隱藏成就
  const hour = new Date().getHours();
  if(hour >= 22 && !unlocked.has('night_owl')) newOnes.push('night_owl');
  if(hour < 7   && !unlocked.has('early_bird')) newOnes.push('early_bird');

  // 累積總組數
  const totalSets = sessions.reduce((acc,s)=>acc+(s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0),0);
  if(totalSets>=100 && !unlocked.has('century_sets')) newOnes.push('century_sets');

  // 週全勤：同一週有上肢+下肢各一次
  if(!unlocked.has('full_week')){
    const weekMap = {};
    sessions.forEach(s=>{
      const d = new Date(s.date); const mon = new Date(d); mon.setDate(d.getDate()-d.getDay()+1);
      const wk = mon.toISOString().slice(0,10);
      if(!weekMap[wk]) weekMap[wk]={upper:0,lower:0};
      if(weekMap[wk][s.type]!==undefined) weekMap[wk][s.type]++;
    });
    if(Object.values(weekMap).some(w=>w.upper>0&&w.lower>0)) newOnes.push('full_week');
  }

  // 月全勤：單月12次
  if(!unlocked.has('monthly_full')){
    const mMap = {};
    sessions.forEach(s=>{ const m=s.date.slice(0,7); mMap[m]=(mMap[m]||0)+1; });
    if(Object.values(mMap).some(v=>v>=12)) newOnes.push('monthly_full');
  }

  // 超額完成（flag from confirmSet）
  if(flag.overachiever && !unlocked.has('overachiever')) newOnes.push('overachiever');

  // 完美主義者（flag from unlockSet）
  if(flag.unlock_relock && !unlocked.has('unlock_relock')) newOnes.push('unlock_relock');

  // 精準打擊（flag from confirmSet）
  if(flag.precise && !unlocked.has('precise')) newOnes.push('precise');

  // 全成就（非隱藏）
  if(!unlocked.has('all_normal')){
    const normalIds = ACHIEVEMENTS_DEF.filter(a=>!a.secret).map(a=>a.id);
    const afterNew = new Set([...gameState.achievements, ...newOnes]);
    if(normalIds.every(id=>afterNew.has(id))) newOnes.push('all_normal');
  }

  newOnes.forEach(id=>{
    gameState.achievements.push(id);
    const def = ACHIEVEMENTS_DEF.find(a=>a.id===id);
    if(def) showAchNotif(def);
  });
  if(newOnes.length) localStorage.setItem(GYM_GAME, JSON.stringify(gameState));
}

function getTitle(){
  const n = gameState.achievements.length;
  if(n>=40) return '傳說';
  if(n>=25) return '猛獸';
  if(n>=15) return '鐵人';
  if(n>=8)  return '戰士';
  if(n>=3)  return '學徒';
  return '新手';
}

// ─── Progress ────────────────────────────────────────────────
function renderProgress(){
  const wrap = document.getElementById('section-progress');
  if(!sessions.length){
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:#7f8c8d;">還沒有訓練紀錄<br>完成第一次訓練後這裡會顯示進步</div>';
    return;
  }

  // Collect per-exercise history: {name -> [{date, maxW}]}
  const exHistory = {};
  sessions.forEach(sess=>{
    (sess.exercises||[]).forEach(ex=>{
      if(!ex.sets||!ex.sets.length) return;
      const maxW = Math.max(...ex.sets.map(s=>parseFloat(s.w)||0));
      if(!exHistory[ex.name]) exHistory[ex.name]=[];
      // Only add if date not already recorded (take max of same day)
      const existing = exHistory[ex.name].find(e=>e.date===sess.date);
      if(existing){ existing.maxW = Math.max(existing.maxW, maxW); }
      else { exHistory[ex.name].push({date:sess.date, maxW}); }
    });
  });

  let html = '<div style="padding:12px;">';
  html += '<div style="font-family:\'PressStart\',monospace;font-size:10px;color:#f39c12;padding:8px 4px 16px;letter-spacing:1px;display:flex;align-items:center;gap:6px;">'+pxIcon('chart',1)+'重量進步紀錄</div>';

  Object.keys(exHistory).forEach(name=>{
    const history = exHistory[name].sort((a,b)=>a.date.localeCompare(b.date));
    const first = history[0];
    const last  = history[history.length-1];
    const diff  = last.maxW - first.maxW;
    const diffStr = diff > 0 ? '+'+diff+'kg '+pxIcon('up',1) : diff < 0 ? diff+'kg '+pxIcon('down',1) : '持平 '+pxIcon('right',1);
    const diffColor = diff > 0 ? '#2ecc71' : diff < 0 ? '#e74c3c' : '#f39c12';

    html += '<div style="background:#1a1a2e;border-radius:12px;margin-bottom:12px;padding:14px;">';
    html += '<div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;">'+escHtml(name)+'</div>';

    // Progress summary
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    html += '<div style="text-align:center;"><div style="font-size:11px;color:#7f8c8d;">開始</div><div style="font-size:18px;font-weight:700;color:#fff;">'+first.maxW+'<span style="font-size:11px;">kg</span></div><div style="font-size:10px;color:#7f8c8d;">'+first.date+'</div></div>';
    html += '<div style="font-size:20px;font-weight:700;color:'+diffColor+';">'+diffStr+'</div>';
    html += '<div style="text-align:center;"><div style="font-size:11px;color:#7f8c8d;">最近</div><div style="font-size:18px;font-weight:700;color:#fff;">'+last.maxW+'<span style="font-size:11px;">kg</span></div><div style="font-size:10px;color:#7f8c8d;">'+last.date+'</div></div>';
    html += '</div>';

    // Timeline dots
    if(history.length > 1){
      html += '<div style="overflow-x:auto;padding-bottom:4px;"><div style="display:flex;align-items:flex-end;gap:8px;min-width:max-content;padding:4px 0;">';
      const maxVal = Math.max(...history.map(h=>h.maxW));
      const minVal = Math.min(...history.map(h=>h.maxW));
      const range  = maxVal - minVal || 1;
      history.forEach(h=>{
        const pct = ((h.maxW - minVal) / range) * 40 + 10;
        html += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">';
        html += '<div style="font-size:10px;color:#f39c12;font-weight:700;">'+h.maxW+'</div>';
        html += '<div style="width:8px;height:'+Math.round(pct)+'px;background:#3498db;border-radius:4px 4px 0 0;"></div>';
        html += '<div style="font-size:9px;color:#7f8c8d;writing-mode:vertical-rl;transform:rotate(180deg);">'+h.date.slice(5)+'</div>';
        html += '</div>';
      });
      html += '</div></div>';
    } else {
      html += '<div style="font-size:12px;color:#7f8c8d;">完成更多訓練後會顯示進步曲線</div>';
    }

    html += '</div>';
  });

  html += '</div>';
  wrap.innerHTML = html;
}

          <div style="display:flex;justify-content:space-between;padding:3px 0;"><span>白飯 100g（熟）</span><span style="color:#7f8c8d;">130kcal　蛋白2.7g　脂0.3g　碳28g</span></div>
          <div style="margin-top:8px;padding-top:6px;border-top:1px solid #f39c12;display:flex;justify-content:space-between;font-weight:700;"><span style="color:#f39c12;">小計</span><span>250kcal　蛋白25.7g　脂2.8g　碳28g</span></div>
        </div>

      <!-- 全日合計 -->

        <div style="font-size:12px;color:#f39c12;font-weight:700;margin-bottom:8px;">全日合計</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
          <div><div style="font-size:16px;font-weight:700;color:#e74c3c;">2,111</div><div style="font-size:9px;color:#7f8c8d;">kcal</div></div>
          <div><div style="font-size:16px;font-weight:700;color:#3498db;">163g</div><div style="font-size:9px;color:#7f8c8d;">蛋白質</div></div>
          <div><div style="font-size:16px;font-weight:700;color:#f39c12;">57g</div><div style="font-size:9px;color:#7f8c8d;">脂肪</div></div>
          <div><div style="font-size:16px;font-weight:700;color:#27ae60;">222g</div><div style="font-size:9px;color:#7f8c8d;">碳水</div></div>
        </div>

  </div>`;
}

// ─── Map ─────────────────────────────────────────────────────
let mapViewYear  = new Date().getFullYear();
let mapViewMonth = new Date().getMonth();

function renderMap(){
  const wrap = document.getElementById('section-map');

  const doneMap = {};
  sessions.forEach(s=>{ doneMap[s.date] = s; });

  const today = new Date(); today.setHours(0,0,0,0);
  const todayS = todayStr();
  const dayLabels = ['日','一','二','三','四','五','六'];
  const typeLabel = {upperA:'上A',lowerA:'下A',upperB:'上B',lowerB:'下B'};

  const year = mapViewYear, month = mapViewMonth;
  const monthName = year+'年'+(month+1)+'月';
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let html = '<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:12px;">';

  // Header
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  html += '<button onclick="mapPrevMonth()" style="background:#1a1a2e;border:none;color:#ecf0f1;font-size:20px;padding:8px 14px;border-radius:8px;cursor:pointer;">‹</button>';
  html += '<div style="font-size:14px;font-weight:700;color:#ecf0f1;">'+monthName+'</div>';
  html += '<button onclick="mapNextMonth()" style="background:#1a1a2e;border:none;color:#ecf0f1;font-size:20px;padding:8px 14px;border-radius:8px;cursor:pointer;">›</button>';
  html += '</div>';

  // Day labels row
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;">';
  dayLabels.forEach(l=>{
    html += '<div style="font-size:11px;color:#7f8c8d;text-align:center;padding:4px 0;">'+l+'</div>';
  });
  html += '</div>';

  // Calendar grid — fill remaining height
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:3px;flex:1;">';
  for(let i=0;i<firstDay;i++) html += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dt = new Date(year, month, d);
    const sess = doneMap[ds];
    const isToday = ds === todayS;
    const isFuture = dt > today;

    let bg = '#12122a', color = '#3a3a5a', border = 'none', label = '';
    if(sess){
      bg = '#1e7a45'; color = '#fff';
      label = typeLabel[sess.type] || sess.type || '';
    } else if(isToday){
      bg = '#1a1a2e'; border = '2px solid #f39c12'; color = '#f39c12';
    } else if(isFuture){
      bg = '#0d0d1a'; color = '#1e1e3a';
    }

    const clickStyle = sess ? 'cursor:pointer;' : '';
    const onclick = sess ? ' onclick="showDayDetail(\''+ds+'\')"' : '';
    html += '<div'+onclick+' style="border-radius:8px;background:'+bg+';color:'+color+';border:'+border+';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;'+clickStyle+'">';
    html += '<div style="font-size:13px;font-weight:700;">'+d+'</div>';
    if(label) html += '<div style="font-size:9px;opacity:0.85;">'+label+'</div>';
    html += '</div>';
  }
  html += '</div></div>';

  wrap.innerHTML = html;
  wrap.style.height = '100%';
  wrap.style.boxSizing = 'border-box';
  wrap.style.overflow = 'hidden';

  // Touch swipe to change month
  let touchStartX = 0;
  wrap.ontouchstart = e=>{ touchStartX = e.touches[0].clientX; };
  wrap.ontouchend = e=>{
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){
      if(dx < 0) mapNextMonth();
      else mapPrevMonth();
    }
  };
}

function mapPrevMonth(){
  mapViewMonth--;
  if(mapViewMonth < 0){ mapViewMonth = 11; mapViewYear--; }
  renderMap();
}
function mapNextMonth(){
  mapViewMonth++;
  if(mapViewMonth > 11){ mapViewMonth = 0; mapViewYear++; }
  renderMap();
}

// ─── Settings ────────────────────────────────────────────────
function renderSettings(){
  const wrap = document.getElementById('section-settings');
  const step = WEEK_CYCLE[cycleProgress];
  const stepLabel = step ? step.label : '—';

  wrap.innerHTML =
    '<div id="set-section">'+
    '<div class="set-group">'+
    '<h3>訓練進度</h3>'+
    '<div style="background:#0f0f2a;border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;color:#bdc3c7;">'+
    '目前進度：<strong style="color:#f39c12;">'+escHtml(stepLabel)+'</strong><br>'+
    '<span style="font-size:11px;color:#7f8c8d;">完成訓練後自動推進，不依賴日期</span>'+
    '</div>'+
    '<button class="save-btn" onclick="restartCycle()">從頭開始（重設進度）</button>'+
    '</div>'+
    '<div class="set-group">'+
    '<h3>資料管理</h3>'+
    '<button class="save-btn" onclick="exportData()">匯出備份</button>'+
    '<button class="save-btn" onclick="document.getElementById(\'import-file\').click()">匯入備份</button>'+
    '<input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)">'+
    '<div style="font-size:11px;color:#7f8c8d;margin:4px 0 12px;">紀錄只存在這支手機的瀏覽器，換手機或清除瀏覽器資料前請先匯出</div>'+
    '<button class="danger-btn" onclick="resetTemplates()">重設課表</button>'+
    '<button class="danger-btn" onclick="resetAll()">重設所有資料</button>'+
    '</div>'+
    '</div>';
}

function restartCycle(){
  if(!confirm('確定要從頭開始？訓練紀錄不會清除，只重設課表進度。')) return;
  cycleProgress = 0;
  localStorage.setItem(GYM_PROGRESS, JSON.stringify({step:0}));
  currentDay = WEEK_CYCLE[0].day;
  currentSession = {};
  confirmedSets = {};
  localStorage.removeItem(GYM_SESSION_DRAFT);
  showToast('已從下肢A重新開始');
  renderAll();
}

function savePlan(){
  const val = document.getElementById('plan-date').value;
  if(!val){ showToast('請選擇日期'); return; }
  localStorage.setItem(GYM_PLAN, JSON.stringify({startDate:val}));
  // Reset progress to start from beginning
  cycleProgress = 0;
  localStorage.setItem(GYM_PROGRESS, JSON.stringify({step:0}));
  currentDay = WEEK_CYCLE[0].day;
  showToast('計畫已儲存！從下肢A開始');
  renderAll();
}

function resetTemplates(){
  if(!confirm('確定要重設課表？自訂課表將遺失。')) return;
  localStorage.removeItem(GYM_TEMPLATES);
  templates = getTemplates();
  currentSession = {};
  confirmedSets  = {};
  showToast('課表已重設');
  renderAll();
}

function resetAll(){
  if(!confirm('確定要清除所有資料？此操作無法復原！')) return;
  [GYM_SESSIONS,GYM_GAME,GYM_TEMPLATES,GYM_PLAN,GYM_SESSION_DRAFT,GYM_PROGRESS].forEach(k=>localStorage.removeItem(k));
  cycleProgress = 0;
  currentDay = WEEK_CYCLE[0].day;
  gameState     = {xp:0,level:1,streak:0,lastDate:'',achievements:[]};
  sessions      = [];
  templates     = getTemplates();
  currentSession= {};
  confirmedSets = {};
  renderHeader();
  showToast('所有資料已清除');
  renderAll();
}

// ─── Backup ──────────────────────────────────────────────────
const BACKUP_KEYS = [GYM_SESSIONS,GYM_GAME,GYM_TEMPLATES,GYM_PLAN,GYM_SESSION_DRAFT,GYM_PROGRESS];

function exportData(){
  const data = {};
  BACKUP_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v!==null) data[k] = v;
  });
  const blob = new Blob([JSON.stringify({app:'gym-tracker', exportedAt:new Date().toISOString(), data})],
    {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gym-backup-'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  showToast('備份已匯出');
}

function importData(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let backup;
    try{ backup = JSON.parse(reader.result); }catch(e){ backup = null; }
    if(!backup || backup.app!=='gym-tracker' || !backup.data){
      showToast('不是有效的備份檔');
      return;
    }
    const when = backup.exportedAt ? backup.exportedAt.slice(0,10) : '未知日期';
    if(!confirm('匯入 '+when+' 的備份？目前手機上的資料會被覆蓋。')) return;
    BACKUP_KEYS.forEach(k=>{
      if(k in backup.data) localStorage.setItem(k, backup.data[k]);
      else localStorage.removeItem(k);
    });
    alert('匯入完成，將重新載入');
    location.reload();
  };
  reader.readAsText(file);
}

// ─── Helpers ─────────────────────────────────────────────────
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function dateDiffDays(a,b){
  return Math.round((new Date(b)-new Date(a))/86400000);
}

function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── Boot ────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
</script>

function spriteSVG(grid, scale){
  let r='';
  grid.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const c=row[x]; if(PAL[c]) r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+PAL[c]+'"/>'; } });
  return '<svg width="'+(20*scale)+'" height="'+(20*scale)+'" viewBox="0 0 20 20" shape-rendering="crispEdges">'+r+'</svg>';
}
const big = document.getElementById('big'), cards = document.getElementById('cards');
Object.keys(SPRITES).forEach(name=>{
  big.innerHTML += '<div class="item"><div class="tile">'+spriteSVG(SPRITES[name],6)+'</div><div>'+name+'</div></div>';
  cards.innerHTML += '<div class="card"><span class="tile">'+spriteSVG(SPRITES[name],2)+'</span>'+name+'</div>';
});
